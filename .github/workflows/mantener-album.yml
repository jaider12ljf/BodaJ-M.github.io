# Mantiene activo el proyecto gratis de Supabase del álbum.
# El plan gratis se pausa tras 7 días sin uso; esta consulta liviana cada 2 días lo evita.
name: Mantener activo el álbum
on:
  schedule:
    - cron: "17 13 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar el álbum
        run: |
          CFG=$(curl -s https://jaider12ljf.github.io/BodaJ-M.github.io/album/config.js)
          URL=$(echo "$CFG" | grep -o "https://[a-z0-9]*\.supabase\.co")
          KEY=$(echo "$CFG" | grep -o "eyJ[A-Za-z0-9._-]*")
          curl -sf -o /dev/null -w "%{http_code}\n" "$URL/rest/v1/recuerdos?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
